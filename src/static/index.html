<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amelda</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">
    <div id="top-row">
      <div id="panel-top-left" class="panel panel-top-side">
        <button id="theme-toggle">Light Mode</button>
      </div>
      <div id="panel-top-center" class="panel panel-top-center nav-side"></div>
      <div id="panel-top-right" class="panel panel-top-side"></div>
    </div>

    <div id="middle-row">
      <div id="panel-left" class="panel panel-left"></div>

      <div id="center" class="panel"></div>

      <div id="panel-right" class="panel panel-right"></div>
    </div>

    <div id="bottom-row">
      <div id="panel-bottom-left" class="panel panel-bottom-side"></div>
      <div id="panel-bottom-center" class="panel panel-bottom-center nav-side"></div>
      <div id="panel-bottom-right" class="panel panel-bottom-side"></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
