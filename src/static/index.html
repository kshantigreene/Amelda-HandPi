<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amelda</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">
    <div id="top-row">
      <div id="panel-top-left" class="panel panel-top-side"></div>
      <div id="panel-top-center" class="panel panel-top-center nav-side"></div>
      <div id="panel-top-right" class="panel panel-top-side">
        <div class="hamburger-wrap">
          <button id="hamburger-btn" class="hamburger-btn" title="Menu">☰</button>
          <div id="hamburger-menu" class="hamburger-menu" hidden>
            <button id="theme-toggle" class="menu-item">Light Mode</button>
            <div class="menu-divider"></div>
            <button id="open-graph" class="menu-item">Open Graph…</button>
            <button id="save-graph" class="menu-item" style="display:none">Save Graph</button>
            <button id="close-graph" class="menu-item" style="display:none">Close Graph</button>
            <div class="menu-divider"></div>
            <button id="export-connected" class="menu-item" title="Save notes connected to the focused note">Export Connected</button>
            <button id="export-all" class="menu-item">Export All</button>
          </div>
          <input type="file" id="open-graph-input" accept=".json" style="display:none">
        </div>
      </div>
    </div>

    <div id="middle-row">
      <div id="panel-left" class="panel panel-left"></div>

      <div id="center" class="panel"></div>

      <div id="panel-right" class="panel panel-right"></div>
    </div>

    <div id="bottom-row">
      <div id="panel-bottom-left" class="panel panel-bottom-side"></div>
      <div id="panel-bottom-center" class="panel panel-bottom-center nav-side"></div>
      <div id="panel-bottom-right" class="panel panel-bottom-side"></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
