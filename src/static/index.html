<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amelda</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">
    <div id="top-row">
      <div id="panel-top-left" class="panel panel-top-side">
        <button id="theme-toggle">Light Mode</button>
      </div>
      <div id="panel-top-center" class="panel panel-top-center"></div>
      <div id="panel-top-right" class="panel panel-top-side"></div>
    </div>

    <div id="middle-row">
      <div id="panel-left" class="panel panel-left"></div>

      <div id="center">
        <textarea id="input" placeholder="Type here..."></textarea>
        <div id="button-row">
          <button id="new-btn" class="buttons" style="display:none">New Note</button>
          <button id="submit-btn" class="buttons">Submit</button>
        </div>
      </div>

      <div id="panel-right" class="panel panel-right"></div>
    </div>

    <div id="panel-bottom" class="panel panel-bottom"></div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
