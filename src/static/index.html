<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Amelda</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Amelda" />
  <meta name="theme-color" content="#0f0f0f" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">
    <div id="top-row">
      <div id="panel-top-left" class="panel panel-top-side"></div>
      <div id="panel-top-center" class="panel panel-top-center nav-side"></div>
      <div id="panel-top-right" class="panel panel-top-side">
        <div class="hamburger-wrap">
          <button id="hamburger-btn" class="hamburger-btn" title="Menu"><img src="./menu.png" alt="Menu" /></button>
          <div id="hamburger-menu" class="hamburger-menu" hidden>
            <button id="theme-toggle" class="menu-item">Light Mode</button>
            <div class="menu-divider"></div>
            <button id="open-graph" class="menu-item">Open Graph…</button>
            <button id="save-graph" class="menu-item" style="display:none">Save Graph</button>
            <button id="close-graph" class="menu-item" style="display:none">Close Graph</button>
            <div class="menu-divider"></div>
            <button id="export-connected" class="menu-item" title="Save notes connected to the focused note">Export Connected</button>
            <button id="export-all" class="menu-item">Export All</button>
            <div class="menu-divider"></div>
            <a href="https://www.buymeacoffee.com/Amelda" target="_blank" rel="noopener" class="menu-item">&#x2615; Buy me a coffee</a>
          </div>
          <input type="file" id="open-graph-input" accept=".json" style="display:none">
        </div>
      </div>
    </div>

    <div id="middle-row">
      <div id="panel-left" class="panel panel-left"></div>

      <div id="center" class="panel"></div>

      <div id="panel-right" class="panel panel-right"></div>
    </div>

    <div id="bottom-row">
      <div id="panel-bottom-left" class="panel panel-bottom-side"></div>
      <div id="panel-bottom-center" class="panel panel-bottom-center nav-side"></div>
      <div id="panel-bottom-right" class="panel panel-bottom-side"></div>
    </div>
  </div>

  <div id="right-panel-overlay"></div>
  <button id="left-panel-toggle" aria-label="Toggle suggestions">&#x2039;</button>
  <button id="right-panel-toggle" aria-label="Toggle connections">&#x203a;</button>

  <script src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
